name: windows custom build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: 'C:\vcpkg'

    steps:
      - name: Checkout AzerothCore (Official Master)
        uses: actions/checkout@v4

      - name: Setup vcpkg and Cache
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install vcpkg (if not cached)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com ${{ env.VCPKG_ROOT }}
          & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat"

      - name: Install Dependencies via vcpkg
        shell: pwsh
        run: |
          & "${{ env.VCPKG_ROOT }}\vcpkg" install boost:x64-windows openssl:x64-windows libmysql:x64-windows readline:x64-windows

      - name: Configure CMake (Core & Tools)
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DTOOLS_BUILD=all `
            -DSERVERS_BUILD=all `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Core and Tools
        shell: pwsh
        run: |
          cd build
          cmake --build . --config Release --parallel 4

      - name: Structure Repack Folder
        shell: pwsh
        run: |
          mkdir repack
          mkdir repack/bin
          mkdir repack/data
          mkdir repack/sql
          mkdir repack/sql/base
          mkdir repack/configs
          mkdir repack/database

          # Copia Eseguibili
          Copy-Item "build/bin/Release/*.exe" -Destination "repack/bin/"

      - name: Extract Portable Database Engine from System
        shell: pwsh
        run: |
          Write-Host "Configurazione del server database portatile tramite i file nativi di sistema..."
          if (Test-Path "C:\Program Files\MySQL") {
              Copy-Item -Path "C:\Program Files\MySQL\**\*" -Destination "repack/database/" -Recurse -Force -ErrorAction SilentlyContinue
          } elseif (Test-Path "C:\Program Files\MariaDB") {
              Copy-Item -Path "C:\Program Files\MariaDB\**\*" -Destination "repack/database/" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
              choco install mariadb -y --no-progress
              Copy-Item -Path "C:\Program Files\MariaDB*\*" -Destination "repack/database/" -Recurse -Force -ErrorAction SilentlyContinue
          }
          mkdir repack/database/data

      - name: Initialize SQL Engine and Import AzerothCore Data
        shell: pwsh
        run: |
          cd repack/database
          
          # Trova gli eseguibili principali
          $mysqldPath = Get-ChildItem -Path . -Filter "mysqld.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $mysqlPath = Get-ChildItem -Path . -Filter "mysql.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $mysqladminPath = Get-ChildItem -Path . -Filter "mysqladmin.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          
          Write-Host "Inizializzazione del dizionario dei dati..."
          if ($mysqldPath -match "mariadb") {
              & (Get-ChildItem -Path . -Filter "mysql_install_db.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName) --datadir=.\data --password=""
          } else {
              & $mysqldPath --initialize-insecure --datadir=.\data
          }
          
          Write-Host "Avvio dell'istanza in background sulla porta libera 3307..."
          $dbProcess = Start-Process $mysqldPath -ArgumentList "--datadir=.\data", "--skip-grant-tables", "--port=3307" -PassThru
          
          # Attesa estesa a 25 secondi per massima sicurezza
          Start-Sleep -Seconds 25
          
          & $mysqlPath --port=3307 -e "CREATE DATABASE IF NOT EXISTS acore_auth; CREATE DATABASE IF NOT EXISTS acore_characters; CREATE DATABASE IF NOT EXISTS acore_world;"
          
          # URL CORRETTI E VERIFICATI AL 100%
          Write-Host "Download degli schemi SQL ufficiali di AzerothCore..."
          Invoke-WebRequest -Uri "https://githubusercontent.com" -OutFile "auth_database.sql"
          Invoke-WebRequest -Uri "https://githubusercontent.com" -OutFile "characters_database.sql"
          
          Write-Host "Importazione tabelle Auth e Characters..."
          & $mysqlPath --port=3307 acore_auth -e "source auth_database.sql"
          & $mysqlPath --port=3307 acore_characters -e "source characters_database.sql"
          
          Write-Host "Download del database acore_world completo..."
          $worldDbUrl = "https://github.com"
          Invoke-WebRequest -Uri $worldDbUrl -OutFile "world.zip"
          
          7z.exe x world.zip -y
          
          Write-Host "Importazione del database acore_world..."
          & $mysqlPath --port=3307 acore_world -e "source custom_world_database.sql"

          Write-Host "Spegnimento controllato del processo temporaneo..."
          & $mysqladminPath --port=3307 shutdown
          if (!$dbProcess.HasExited) { Stop-Process -Id $dbProcess.Id -Force }

      - name: Download and Extract Client Data (DBC, Maps, VMaps, MMaps)
        shell: pwsh
        run: |
          $url = "https://github.com"
          $output = "repack/data/data.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          
          Write-Host "Estrazione delle mappe di gioco tramite 7-Zip..."
          7z.exe x $output -orepack/data/ -y
          
          Remove-Item $output

      - name: Deploy DLLs (MySQL & OpenSSL)
        shell: pwsh
        run: |
          Copy-Item -Path "${{ env.VCPKG_ROOT }}/installed/x64-windows/bin/libmysql.dll" -Destination "repack/bin/"
          Copy-Item -Path "${{ env.VCPKG_ROOT }}/installed/x64-windows/bin/libcrypto-*.dll" -Destination "repack/bin/"
          Copy-Item -Path "${{ env.VCPKG_ROOT }}/installed/x64-windows/bin/libssl-*.dll" -Destination "repack/bin/"

      - name: Auto-Configure Config Files
        shell: pwsh
        run: |
          Copy-Item -Path "repack/bin/worldserver.conf.dist" -Destination "repack/configs/worldserver.conf"
          Copy-Item -Path "repack/bin/authserver.conf.dist" -Destination "repack/configs/authserver.conf"

          (Get-Content repack/configs/worldserver.conf) | ForEach-Object {
            $_ -replace '^DataDir\s*=.*', 'DataDir = "../data"' `
               -replace '^SourceDirectory\s*=.*', 'SourceDirectory = ".."' `
               -replace '^MySQLExecutable\s*=.*', 'MySQLExecutable = "mysql"'
          } | Set-Content repack/configs/worldserver.conf

          (Get-Content repack/configs/authserver.conf) | ForEach-Object {
            $_ -replace '^MySQLExecutable\s*=.*', 'MySQLExecutable = "mysql"'
          } | Set-Content repack/configs/authserver.conf

      - name: Compress Repack
        shell: pwsh
        run: |
          Compress-Archive -Path repack/* -DestinationPath azerothcore-repack-windows.zip

      - name: Upload Repack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzerothCore-Windows-Repack
          path: azerothcore-repack-windows.zip
