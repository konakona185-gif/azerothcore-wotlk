name: windows custom build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout AzerothCore (Official Master)
        uses: actions/checkout@v4

      # 1. Installazione delle librerie e di Lua (GIA' VERDE ✅)
      - name: Install official dependencies via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installazione dei components ufficiali di fabbrica e di Lua..."
          choco install boost-msvc-14.3 -y --no-progress
          choco install openssl -y --no-progress
          choco install lua51 -y --no-progress
          
          echo "BOOST_ROOT=C:\local\boost_1_87_0" >> $env:GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV
          echo "LUA_DIR=C:\tools\lua51" >> $env:GITHUB_ENV

      # 2. Generazione dei file con CMake (GIA' VERDE ✅)
      - name: Configure CMake (Core & Tools)
        shell: pwsh
        run: |
          Write-Host "Generazione dei file di build con CMake..."
          mkdir build
          cd build
          
          $mysqlSdkPath = Get-ChildItem -Path "C:\Program Files\" -Filter "MySQL Connector *" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (!$mysqlSdkPath) { $mysqlSdkPath = "C:\Program Files\MySQL\MySQL Server 8.0" }
          
          cmake .. `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DTOOLS_BUILD=all `
            -DSERVERS_BUILD=all `
            -DMYSQL_INCLUDE_DIR="$mysqlSdkPath\include" `
            -DMYSQL_LIBRARY="$mysqlSdkPath\lib\libmysql.lib" `
            -DLUA_SYSTEM_BINARIES=ON

      # 3. Compilazione C++ effettiva del Core e dei tuoi Moduli (GIA' VERDE ✅)
      - name: Build Core and Tools
        shell: pwsh
        run: |
          Write-Host "Avvio della compilazione C++ (Attendi qualche minuto)..."
          cd build
          cmake --build . --config Release --parallel 4

      # 4. NUOVO - Costruzione millimetrica della cartella Repack e recupero di TUTTI i file .conf.dist (Server e Moduli)
      - name: Structure Repack and Extract Configs
        shell: pwsh
        run: |
          Write-Host "Creazione dello scheletro delle cartelle..."
          mkdir repack
          mkdir repack/bin
          mkdir repack/data
          mkdir repack/sql
          mkdir repack/configs
          mkdir repack/database

          Write-Host "Copia degli eseguibili reali e dei .conf.dist del server..."
          Copy-Item "build/bin/Release/*.exe" -Destination "repack/bin/"
          Copy-Item "build/bin/Release/*.conf.dist" -Destination "repack/bin/"

          Write-Host "Scansione e recupero di tutti i file .conf.dist dei moduli..."
          # Cerchiamo in modo dinamico ogni file .conf.dist dentro le cartelle dei moduli e lo copiamo in configs/
          Get-ChildItem -Path "modules" -Filter "*.conf.dist" -Recurse | ForEach-Object {
              Write-Host "-> Trovata configurazione modulo: $($_.Name)"
              Copy-Item -Path $_.FullName -Destination "repack/configs/" -Force
          }

      # 5. NUOVO - Estrazione del motore MySQL portatile di sistema
      - name: Extract Portable Database Engine from System
        shell: pwsh
        run: |
          Write-Host "Copia dei file binari del database di sistema..."
          if (Test-Path "C:\Program Files\MySQL\MySQL Server 8.0") {
              Copy-Item -Path "C:\Program Files\MySQL\MySQL Server 8.0\**\*" -Destination "repack/database/" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
              choco install mariadb -y --no-progress
              Copy-Item -Path "C:\Program Files\MariaDB*\*" -Destination "repack/database/" -Recurse -Force -ErrorAction SilentlyContinue
          }
