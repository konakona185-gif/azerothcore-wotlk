name: windows custom build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout AzerothCore (Official Master)
        uses: actions/checkout@v4

      - name: Install official dependencies via vcpkg
        shell: pwsh
        run: |
          Write-Host "Installazione rapida delle librerie native..."
          # TRUCCHETTO: Usiamo vcpkg in modalita' locale per saltare download esterni e aggiornamenti infiniti
          C:\vcpkg\vcpkg.exe install boost-system openssl --triplet x64-windows
          
          # Diciamo a GitHub dove trovare le librerie per quando compileremo
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
