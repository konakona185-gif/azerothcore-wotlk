name: windows custom build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout AzerothCore (Official Master)
        uses: actions/checkout@v4

      # 1. Configurazione dello strumento vcpkg ufficiale Microsoft con Cache attiva
      - name: Setup vcpkg native compiler
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: 'C:/vcpkg'
          appendedArguments: '--triplet x64-windows'

      # 2. Installazione nativa e pulita delle librerie richieste da AzerothCore
      - name: Install official dependencies via vcpkg
        shell: pwsh
        run: |
          Write-Host "Installazione nativa delle librerie di base..."
          C:\vcpkg\vcpkg.exe install boost-system boost-filesystem boost-program-options openssl --triplet x64-windows
          
          # Indichiamo a GitHub dove si trova il toolchain di vcpkg per i passaggi futuri
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
