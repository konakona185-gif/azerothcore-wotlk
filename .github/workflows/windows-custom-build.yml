name: windows custom build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout AzerothCore (Official Master)
        uses: actions/checkout@v4

      # 1. Installazione delle librerie tramite Chocolatey (GIA' VERDE ✅)
      - name: Install official dependencies via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installazione dei components ufficiali di fabbrica..."
          choco install boost-msvc-14.3 -y --no-progress
          choco install openssl -y --no-progress
          
          echo "BOOST_ROOT=C:\local\boost_1_87_0" >> $env:GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV

      # 2. NUOVO - Sovrascrittura totale del file di configurazione per forzare il mirror sicuro
      - name: Force Lua Mirror configuration
        shell: pwsh
        run: |
          Write-Host "Riscrittura completa del file di configurazione di mod-ale..."
          $targetFile = "modules/mod-ale/src/lualib/lua/CMakeLists.txt"
          
          # Generiamo da zero il file iniettando direttamente il link funzionante e il suo codice di sicurezza
          $cleanCMakeContent = @"
          include(FetchContent)
          FetchContent_Declare(
              lua52
              URL "https://github.com"
              URL_HASH SHA256=507f7281ad8e985dc102f6a222fa731dc43fe24610b0cb24c60c9bd81e1fdd
          )
          FetchContent_MakeAvailable(lua52)
          "@
          
          if (Test-Path "modules/mod-ale/src/lualib/lua") {
              $cleanCMakeContent | Out-File -FilePath $targetFile -Encoding utf8 -NoNewline
              Write-Host "-> File CMakeLists.txt sovrascritto con successo con il mirror di GitHub!"
          } else {
              Write-Host "-> ATTENZIONE: Cartella di mod-ale non trovata."
          }

      # 3. Generazione dei file di progetto tramite CMake
      - name: Configure CMake (Core & Tools)
        shell: pwsh
        run: |
          Write-Host "Generazione dei file di build con CMake..."
          mkdir build
          cd build
          
          $mysqlSdkPath = Get-ChildItem -Path "C:\Program Files\" -Filter "MySQL Connector *" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (!$mysqlSdkPath) { $mysqlSdkPath = "C:\Program Files\MySQL\MySQL Server 8.0" }
          
          cmake .. `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DTOOLS_BUILD=all `
            -DSERVERS_BUILD=all `
            -DMYSQL_INCLUDE_DIR="$mysqlSdkPath\include" `
            -DMYSQL_LIBRARY="$mysqlSdkPath\lib\libmysql.lib"
