name: windows custom build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      BOOST_ROOT: C:\local\boost_1_87_0

    steps:
      - name: Checkout AzerothCore (Official Master)
        uses: actions/checkout@v4

      # 1. Recupero della Cache interna di GitHub per bloccare le librerie una volta scaricate
      - name: Cache Boost & MySQL
        uses: actions/cache@v4
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      # 2. Configurazione dell'ambiente di sistema con link binario diretto certificato
      - name: Configure OS and Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- Installazione di Boost 1.87.0 ufficiale ---
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost')) {
              Write-Host "Download di Boost 1.87.0 tramite curl..."
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              
              # Usiamo curl con il link ufficiale dei binari precompilati per saltare Cloudflare e i file corrotti
              curl.exe -L -o $boostExe "https://github.com" # Nota: Questo verra' sostituito dal vero eseguibile stabile
              
              # Link ufficiale Microsoft/SourceForge alternativo diretto pulito:
              curl.exe -L -o $boostExe "https://sourceforge.net"
              
              Write-Host "Esecuzione dell'installatore silenzioso di Boost..."
              Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait
          } else {
              Write-Host "Boost recuperato con successo dalla Cache di GitHub!"
          }

          # --- Installazione delle librerie client di MySQL 8.4 ufficiali ---
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
              Write-Host "Download e configurazione del client MySQL..."
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              curl.exe -L -o $mysqlZip "https://mysql.com"
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
          } else {
              Write-Host "Librerie MySQL recuperate con successo dalla Cache di GitHub!"
          }

          # --- Configurazione di OpenSSL gia' presente sul sistema ---
          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          
          if (-not $opensslRoot) { throw 'Nessuna installazione di OpenSSL trovata nel sistema.' }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Uso di OpenSSL impostato nel percorso: $opensslRoot"

          if (-not $opensslRoot) { throw 'Nessuna installazione di OpenSSL trovata nel sistema.' }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Uso di OpenSSL impostato nel percorso: $opensslRoot"
